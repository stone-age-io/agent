# Ordinary build hygiene on every push and pull request, with one addition that
# matters more here than anywhere else in the project.
#
# This repo has per-OS implementation files -- inventory_windows.go,
# service_linux.go, inventory_freebsd.go and friends. `go vet ./...` on a Linux
# runner never compiles the Windows or FreeBSD ones, so a break in either can sit
# unnoticed until a tag is pushed and goreleaser fails, or worse, until a release
# ships. Vetting per GOOS is the only way this repo's code gets type-checked at
# all on two of its three supported platforms.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # -race, as `make test` does. This runner is the only place the race
      # detector runs (it needs cgo), and the relay pump, the platform client's
      # session lock and the once-only Shutdown are all concurrency claims.
      - name: Test
        run: go test -race ./...

      # release.yml runs only on a tag, so without this a broken
      # .goreleaser.yaml is found on release day. Same pin as release.yml.
      - name: Check release config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      # Known vulnerabilities in code the agent actually calls, in its own
      # dependencies and in the Go standard library it is built with. Per GOOS,
      # like vet below: a call path that exists only in the Windows or FreeBSD
      # files is invisible to a Linux-only run.
      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for goos in linux windows freebsd; do
            echo "==> $goos"
            GOOS=$goos govulncheck ./...
          done

      # Per-GOOS, for the reason at the top of this file.
      - name: Vet and build every supported OS
        run: |
          for goos in linux windows freebsd; do
            echo "==> $goos"
            GOOS=$goos go vet ./...
            CGO_ENABLED=0 GOOS=$goos GOARCH=amd64 go build -o /dev/null ./cmd/agent
          done
          echo "==> linux/arm64"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/agent

      # `make lint` existed but nothing ran it, so findings piled up unseen.
      # Per GOOS for the same reason as vet. Pinned, unlike govulncheck: a new
      # linter release adds checks, and that should not fail an unrelated PR.
      - name: Lint every supported OS
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          for goos in linux windows freebsd; do
            echo "==> $goos"
            GOOS=$goos golangci-lint run ./...
          done

      # darwin is not a release target. It is here because the *_stub.go files
      # (the `!windows && !linux && !freebsd` build) compile nowhere else, and
      # they had drifted: GetOSInfo and isServiceAllowed were missing, so the
      # agent would not build on a Mac at all and nothing noticed. Vet covers
      # the tests too.
      - name: Vet the stub build
        run: GOOS=darwin go vet ./...
